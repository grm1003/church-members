<div class="flex flex-col items-center justify-center h-full w-full py-6 px-4">
  <section class="w-full max-w-2xl rounded-xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
    <div class="flex items-center gap-2 mb-2">
      <i nz-icon nzType="team" nzTheme="outline" class="text-2xl text-blue-600"></i>
      <h2 class="text-2xl font-semibold text-slate-900 m-0">Cadastro de Família</h2>
    </div>
    <p class="text-sm text-slate-600 mb-6">
      Cadastre uma nova família para associar e relacionar membros da igreja.
    </p>

    <form
      nz-form
      nzLayout="vertical"
      [formGroup]="form"
      (ngSubmit)="submitFamilia()"
      class="space-y-4"
    >
      <nz-form-item>
        <nz-form-label nzRequired>Nome da Família</nz-form-label>
        <nz-form-control nzErrorTip="Informe o nome da família (mínimo 3 caracteres).">
          <nz-input-group [nzPrefix]="prefixTeam">
            <input
              nz-input
              formControlName="nome"
              placeholder="Ex.: Família Silva / Santos"
              class="h-10"
              autofocus
            />
          </nz-input-group>
          <ng-template #prefixTeam>
            <i nz-icon nzType="team" class="text-slate-400"></i>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item class="!mb-0 pt-2">
        <nz-form-control>
          <div class="flex items-center gap-3">
            <button
              nz-button
              nzType="primary"
              type="submit"
              [nzLoading]="isSubmitting"
              class="h-10 min-w-44 rounded-md px-6 flex items-center justify-center gap-1.5"
            >
              <i nz-icon nzType="plus" nzTheme="outline"></i>
              Salvar Família
            </button>
            <a
              nz-button
              nzType="default"
              routerLink="/familias"
              class="h-10 rounded-md px-4 flex items-center justify-center"
            >
              Cancelar
            </a>
          </div>
        </nz-form-control>
      </nz-form-item>
    </form>
  </section>
</div>
